# /etc/nginx/sites-available/qtopia  →  ln -s ../sites-available/qtopia /etc/nginx/sites-enabled/qtopia
# Domain: qtopia.rever.io.vn — DNS ở Cloudflare (bản ghi A, Proxied/đám mây cam), SSL/TLS mode "Full (strict)".
# Chứng chỉ origin: Cloudflare → SSL/TLS → Origin Server → Create Certificate (hạn 15 năm) → lưu 2 file:
#   /etc/ssl/cloudflare/qtopia.rever.io.vn.pem  và  /etc/ssl/cloudflare/qtopia.rever.io.vn.key (chmod 600)
# Khi đổi sang domain chính thức: thay server_name, đường dẫn chứng chỉ, VITE_SITE_URL rồi build lại.
#
# Thư mục trên VPS:
#   /var/www/qtopia/src        mã nguồn (git clone) + .env.production
#   /var/www/qtopia/releases   các bản build (scripts/release.mjs tạo)
#   /var/www/qtopia/current    symlink → bản đang chạy (đổi nguyên tử, không downtime)

# IP thật của khách (request đi qua Cloudflare). Danh sách: https://www.cloudflare.com/ips/
# Đặt các dòng set_real_ip_from trong /etc/nginx/conf.d/cloudflare-realip.conf (xem deploy/DEPLOY.md).

# HTTP → HTTPS (Cloudflare "Always Use HTTPS" cũng làm việc này ở edge)
server {
    listen 80;
    listen [::]:80;
    server_name qtopia.rever.io.vn;
    location / { return 301 https://qtopia.rever.io.vn$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;   # nginx < 1.25.1 (Ubuntu 22.04 = 1.18): xoá dòng này và dùng "listen 443 ssl http2;"
    server_name qtopia.rever.io.vn;

    ssl_certificate     /etc/ssl/cloudflare/qtopia.rever.io.vn.pem;
    ssl_certificate_key /etc/ssl/cloudflare/qtopia.rever.io.vn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    root /var/www/qtopia/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    # ---- Nén (bản build không nén sẵn) ----
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/ld+json image/svg+xml application/manifest+json application/xml;
    # Nếu nginx có module brotli (libnginx-mod-http-brotli-filter): bỏ comment 2 dòng dưới
    # brotli on;
    # brotli_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # ---- Header bảo mật (Lighthouse Best Practices: CSP, COOP, XFO) ----
    # script-src cần 'unsafe-inline': React 19 chèn script $RC nhỏ để hiện các section lớn đã prerender.
    # connect-src: thêm domain endpoint nhận lead / Supabase nếu khác các domain dưới đây.
    set $csp "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://i.ytimg.com https://*.google-analytics.com https://*.googletagmanager.com; font-src 'self'; frame-src https://www.google.com https://maps.google.com https://www.youtube-nocookie.com; connect-src 'self' https://cloudflareinsights.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://*.supabase.co https://*.workers.dev; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests";
    add_header Content-Security-Policy $csp always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # ---- URL sạch: /vi-tri → vi-tri/index.html; bỏ dấu / ở cuối; 404 thật ----
    rewrite ^/(.+)/$ /$1 permanent;
    location / {
        try_files $uri $uri/index.html =404;
        # HTML luôn kiểm tra lại để thấy nội dung CMS mới ngay sau khi phát hành
        add_header Cache-Control "public, max-age=0, must-revalidate";
        include /etc/nginx/snippets/qtopia-security.conf;
    }
    error_page 404 /404.html;
    location = /404.html { internal; include /etc/nginx/snippets/qtopia-security.conf; }

    # ---- Cache dài cho asset có hash, font, ảnh ----
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/qtopia-security.conf;
    }
    location ^~ /fonts/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/qtopia-security.conf;
    }
    location ^~ /images/ {
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/snippets/qtopia-security.conf;
    }

    # manifest PWA: đúng MIME (mặc định nginx trả application/octet-stream)
    location = /site.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400";
        include /etc/nginx/snippets/qtopia-security.conf;
    }

    # ---- CMS (Vercel) đọc 2 file này để biết trường sửa được và bản nào đang chạy ----
    location ~ ^/cms-(schema|status)\.json$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/qtopia-security.conf;
    }

    # ---- Webhook phát hành từ CMS → dịch vụ deploy hook nội bộ (cms-supabase/vps-deploy-hook) ----
    location = /cms-deploy {
        access_log off;   # URL có thể chứa ?token=… → không ghi log
        proxy_pass http://127.0.0.1:8790/deploy$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        client_max_body_size 16k;
        limit_except GET POST { deny all; }
    }

    # chặn file ẩn (.env, .git…)
    location ~ /\. { deny all; return 404; }
}
